name: Release Windows installers

on:
  push:
    tags:
      - "v*"
      - "!v*-preview.*"

permissions:
  actions: read
  contents: write

jobs:
  windows-release:
    name: Build Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Verify tag and application versions match
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $rootVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $desktopVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match(
            (Get-Content apps/desktop/src-tauri/Cargo.toml -Raw),
            '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          $versions = @($rootVersion, $desktopVersion, $tauriVersion, $cargoVersion)
          if ($versions -contains "" -or ($versions | Where-Object { $_ -ne $tagVersion })) {
            throw "Tag version '$tagVersion' does not match app versions: $($versions -join ', ')"
          }

      - name: Require production code-signing configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_BINARIES_CONFIG: ${{ vars.SIGNPATH_BINARIES_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLERS_CONFIG: ${{ vars.SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $missing = @(
            "SIGNPATH_API_TOKEN"
            "SIGNPATH_ORGANIZATION_ID"
            "SIGNPATH_PROJECT_SLUG"
            "SIGNPATH_SIGNING_POLICY_SLUG"
            "SIGNPATH_BINARIES_CONFIG"
            "SIGNPATH_INSTALLERS_CONFIG"
          ) | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Signed releases are fail-closed. Configure SignPath first; missing: $($missing -join ', ')"
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/gateway/pyproject.toml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Gateway build and test dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".\services\gateway[dev,packaging]"

      - name: Build the Gateway sidecar
        shell: pwsh
        run: .\scripts\build-gateway-sidecar.ps1

      - name: Run quality gates
        shell: pwsh
        run: |
          pnpm typecheck
          pnpm test
          .\.venv\Scripts\python.exe -m pytest services/gateway/tests
          pnpm --filter @memecho/desktop build --mode tauri
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked -- --test-threads=1

      - name: Build the unpackaged desktop executable
        shell: pwsh
        run: pnpm --filter @memecho/desktop tauri build --no-bundle

      - name: Stage unsigned application binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signing-input/binaries | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/memecho-desktop.exe signing-input/binaries/
          Copy-Item apps/desktop/src-tauri/binaries/memecho-gateway-x86_64-pc-windows-msvc.exe signing-input/binaries/

      - name: Upload unsigned application binaries for SignPath
        id: upload_unsigned_binaries
        uses: actions/upload-artifact@v4
        with:
          name: memecho-unsigned-binaries-${{ github.ref_name }}
          path: signing-input/binaries
          if-no-files-found: error

      - name: Sign application and Gateway binaries with SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_BINARIES_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_binaries.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signing-output/binaries

      - name: Install and verify signed application binaries
        shell: pwsh
        run: |
          $main = @(Get-ChildItem signing-output/binaries -Recurse -File -Filter memecho-desktop.exe)
          $gateway = @(Get-ChildItem signing-output/binaries -Recurse -File -Filter memecho-gateway-x86_64-pc-windows-msvc.exe)
          if ($main.Count -ne 1 -or $gateway.Count -ne 1) {
            throw "SignPath did not return exactly one desktop executable and one Gateway executable."
          }
          & .\scripts\assert-authenticode-signatures.ps1 -Path $main[0].FullName, $gateway[0].FullName
          Copy-Item -LiteralPath $main[0].FullName -Destination apps/desktop/src-tauri/target/release/memecho-desktop.exe -Force
          Copy-Item -LiteralPath $gateway[0].FullName -Destination apps/desktop/src-tauri/binaries/memecho-gateway-x86_64-pc-windows-msvc.exe -Force

      - name: Bundle signed application binaries
        shell: pwsh
        run: pnpm --filter @memecho/desktop tauri bundle --bundles nsis,msi

      - name: Stage unsigned installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signing-input/installers | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe signing-input/installers/
          Copy-Item apps/desktop/src-tauri/target/release/bundle/msi/*.msi signing-input/installers/

      - name: Upload unsigned installers for SignPath
        id: upload_unsigned_installers
        uses: actions/upload-artifact@v4
        with:
          name: memecho-unsigned-installers-${{ github.ref_name }}
          path: signing-input/installers
          if-no-files-found: error

      - name: Sign installers with SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_installers.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signing-output/installers

      - name: Verify installers and generate release evidence
        shell: pwsh
        run: |
          $artifacts = @(
            Get-ChildItem signing-output/installers -Recurse -Filter "*-setup.exe" -File
            Get-ChildItem signing-output/installers -Recurse -Filter "*.msi" -File
          )
          if ($artifacts.Count -ne 2) {
            throw "Expected exactly one signed NSIS installer and one signed MSI; found $($artifacts.Count)."
          }
          & .\scripts\assert-authenticode-signatures.ps1 -Path $artifacts.FullName
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $lines = foreach ($artifact in $artifacts) {
            $destination = Join-Path release-artifacts $artifact.Name
            Copy-Item -LiteralPath $artifact.FullName -Destination $destination -Force
            $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          $lines | Set-Content -LiteralPath release-artifacts/SHA256SUMS.txt -Encoding ascii
          $evidence = foreach ($artifact in Get-ChildItem release-artifacts -File | Where-Object { $_.Extension -in @('.exe', '.msi') }) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            [pscustomobject]@{
              file = $artifact.Name
              sha256 = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              signature_status = [string]$signature.Status
              signer_subject = $signature.SignerCertificate.Subject
              signer_thumbprint = $signature.SignerCertificate.Thumbprint
              timestamp_subject = $signature.TimeStamperCertificate.Subject
            }
          }
          $evidence | ConvertTo-Json | Set-Content release-artifacts/SIGNATURES.json -Encoding utf8
          @"
          Windows 11 x64 installation packages for memEcho.

          - ``*-setup.exe``: NSIS installer recommended for most users
          - ``*.msi``: MSI installer for managed Windows environments
          - ``SHA256SUMS.txt``: installer integrity hashes
          - ``SIGNATURES.json``: Authenticode verification evidence

          The desktop executable, Gateway sidecar, NSIS installer, and MSI were
          signed through the approved SignPath policy. Complete clean-machine
          acceptance testing before publishing this draft.
          "@ | Set-Content release-artifacts/RELEASE-NOTES.md -Encoding utf8

      - name: Create the signed draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(Get-ChildItem release-artifacts -File | Where-Object Name -ne 'RELEASE-NOTES.md').FullName
          $isDraft = & gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($isDraft -ne 'true') {
              throw "Release '$tag' already exists and is not a draft; refusing to replace published assets."
            }
            & gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -eq 0) {
              & gh release edit $tag --title "memEcho $tag" --notes-file release-artifacts/RELEASE-NOTES.md --draft
            }
          } else {
            & gh release create $tag @assets --draft --verify-tag --title "memEcho $tag" --notes-file release-artifacts/RELEASE-NOTES.md
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create or update the signed draft GitHub Release."
          }
