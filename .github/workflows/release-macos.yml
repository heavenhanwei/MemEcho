name: Release macOS installer

on:
  push:
    tags:
      - "v*"
      - "!v*-preview.*"

permissions:
  contents: write

jobs:
  macos-release:
    name: Build signed macOS 13+ release (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64" || {
            echo "Expected an Apple Silicon runner, got $(uname -m)." >&2
            exit 1
          }

      - name: Verify tag and application versions match
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          root_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          tauri_version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          cargo_version="$(awk '
            /^\[package\]$/ { in_package=1; next }
            /^\[/ { in_package=0 }
            in_package && /^version[[:space:]]*=/ {
              split($0, parts, "\""); print parts[2]; exit
            }
          ' apps/desktop/src-tauri/Cargo.toml)"
          for version in "$root_version" "$desktop_version" "$tauri_version" "$cargo_version"; do
            test "$version" = "$tag_version" || {
              echo "Tag version '$tag_version' does not match app versions: $root_version, $desktop_version, $tauri_version, $cargo_version" >&2
              exit 1
            }
          done

      - name: Require signing and notarization configuration
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            KEYCHAIN_PASSWORD
            APPLE_API_ISSUER
            APPLE_API_KEY
            APPLE_API_KEY_P8_BASE64
          )
          missing=()
          for name in "${required[@]}"; do
            test -n "${!name:-}" || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "Signed macOS releases are fail-closed. Missing GitHub Secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/memecho-build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -t 7200 -u "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Materialize App Store Connect private key
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          private_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$private_key_path"
          chmod 600 "$private_key_path"
          echo "APPLE_API_KEY_PATH=$private_key_path" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/gateway/pyproject.toml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e 'services/gateway[dev,packaging]'

      - name: Build bundled Gateway and native macOS audio helper
        run: bash scripts/build-macos-sidecars.sh

      - name: Run release quality gates
        run: |
          pnpm typecheck
          pnpm test
          .venv/bin/python -m pytest services/gateway/tests
          pnpm --filter @memecho/desktop build --mode tauri
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked -- --test-threads=1

      - name: Build, sign, and notarize macOS assets
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: pnpm --filter @memecho/desktop tauri build --bundles app,dmg

      - name: Verify signed and notarized output
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find apps/desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          dmg_path="$(find apps/desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app_path" && test -n "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          mount_point="$RUNNER_TEMP/memecho-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg_path" -mountpoint "$mount_point" -nobrowse -readonly
          trap 'hdiutil detach "$mount_point" >/dev/null' EXIT
          installed_app="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$installed_app"
          codesign --verify --deep --strict --verbose=2 "$installed_app"
          spctl --assess --type execute --verbose=4 "$installed_app"
          xcrun stapler validate "$installed_app"
          hdiutil detach "$mount_point"
          trap - EXIT
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Stage verified release assets
        shell: bash
        env:
          APP_PATH: ${{ steps.verify.outputs.app_path }}
          DMG_PATH: ${{ steps.verify.outputs.dmg_path }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          version="${GITHUB_REF_NAME#v}"
          dmg_name="memEcho_${version}_aarch64.dmg"
          app_name="memEcho_${version}_aarch64.app.zip"
          cp "$DMG_PATH" "release-artifacts/$dmg_name"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-artifacts/$app_name"
          (
            cd release-artifacts
            shasum -a 256 "$dmg_name" "$app_name" > SHA256SUMS-macos.txt
          )
          cat > release-artifacts/RELEASE-NOTES-macos.md <<'EOF'
          Signed Windows and notarized macOS installers are built by separate,
          fail-closed GitHub Actions jobs. Keep this release as a draft until
          both platforms pass clean-machine acceptance testing.

          macOS users with Apple Silicon should download the `.dmg` file. The
          `.app.zip` is provided for diagnostic and managed deployment use.
          EOF

      - name: Create or update the draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          assets=(
            release-artifacts/*.dmg
            release-artifacts/*.app.zip
            release-artifacts/SHA256SUMS-macos.txt
          )
          if gh release view "$tag" --json isDraft --jq .isDraft > release-artifacts/is-draft.txt 2>/dev/null; then
            test "$(cat release-artifacts/is-draft.txt)" = "true" || {
              echo "Release '$tag' is already published; refusing to replace its assets." >&2
              exit 1
            }
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" \
              --title "memEcho $tag" \
              --notes-file release-artifacts/RELEASE-NOTES-macos.md \
              --draft
          else
            gh release create "$tag" "${assets[@]}" \
              --draft \
              --verify-tag \
              --title "memEcho $tag" \
              --notes-file release-artifacts/RELEASE-NOTES-macos.md
          fi

      - name: Upload verified macOS CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: memecho-macos-notarized-${{ github.ref_name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            release-artifacts/*.app.zip
            release-artifacts/*.dmg
            release-artifacts/SHA256SUMS-macos.txt
          if-no-files-found: error
