name: Release unsigned Windows preview

on:
  push:
    tags:
      - "v*-preview.*"

permissions:
  contents: write

jobs:
  windows-preview:
    name: Build unsigned Windows x64 preview
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out preview commit
        uses: actions/checkout@v4

      - name: Verify preview tag and application versions
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)-preview\.(?<iteration>\d+)$') {
            throw "Preview tag must use v<major>.<minor>.<patch>-preview.<number>."
          }
          $baseVersion = $Matches.version
          $rootVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $desktopVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match(
            (Get-Content apps/desktop/src-tauri/Cargo.toml -Raw),
            '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          $versions = @($rootVersion, $desktopVersion, $tauriVersion, $cargoVersion)
          if ($versions -contains "" -or ($versions | Where-Object { $_ -ne $baseVersion })) {
            throw "Preview base version '$baseVersion' does not match app versions: $($versions -join ', ')"
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/gateway/pyproject.toml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Gateway build and test dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".\services\gateway[dev,packaging]"

      - name: Build the Gateway sidecar
        shell: pwsh
        run: .\scripts\build-gateway-sidecar.ps1

      - name: Run quality gates
        shell: pwsh
        run: |
          pnpm typecheck
          pnpm test
          .\.venv\Scripts\python.exe -m pytest services/gateway/tests
          pnpm --filter @memecho/desktop build --mode tauri
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked -- --test-threads=1

      - name: Build installers and publish the GitHub Prerelease
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: memEcho ${{ github.ref_name }} (Unsigned Preview)
          releaseBody: |
            ## Unsigned early-access preview

            This build is published by an individual open-source developer for
            early testing. It does **not** yet carry a publicly trusted Windows
            Authenticode signature. Windows SmartScreen, Smart App Control,
            browsers, antivirus products, or enterprise policy may warn or block it.

            Download only from the official memEcho GitHub repository and verify
            the file against `SHA256SUMS.txt`. Do not disable Windows security
            features to install this preview.

            - `*-setup.exe`: NSIS installer recommended for preview testing
            - `*.msi`: MSI installer for managed test environments
          releaseDraft: true
          prerelease: true
          generateReleaseNotes: true

      - name: Generate preview integrity manifest
        shell: pwsh
        run: |
          $bundleRoot = "apps/desktop/src-tauri/target/release/bundle"
          $artifacts = @(
            Get-ChildItem "$bundleRoot/nsis" -Filter "*-setup.exe" -File -ErrorAction SilentlyContinue
            Get-ChildItem "$bundleRoot/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue
          )
          if ($artifacts.Count -ne 2) {
            throw "Expected exactly one NSIS installer and one MSI; found $($artifacts.Count)."
          }
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $checksums = foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
              throw "Preview signing status changed unexpectedly for '$($artifact.Name)': $($signature.Status)"
            }
            $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          $checksums | Set-Content release-artifacts/SHA256SUMS.txt -Encoding ascii
          [pscustomobject]@{
            tag = "${{ github.ref_name }}"
            commit = "${{ github.sha }}"
            signed = $false
            intended_use = "early-access testing only"
          } | ConvertTo-Json | Set-Content release-artifacts/UNSIGNED-PREVIEW.json -Encoding utf8

      - name: Upload preview integrity files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" release-artifacts/SHA256SUMS.txt release-artifacts/UNSIGNED-PREVIEW.json --clobber
          if ($LASTEXITCODE -eq 0) {
            gh release edit "${{ github.ref_name }}" --draft=false --prerelease=true
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to upload preview integrity files."
          }
